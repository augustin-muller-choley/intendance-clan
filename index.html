<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Intendance du clan</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <!-- Ce fichier ne contient que la structure : des cases vides avec un nom (id).
         app.js les remplit avec les données. Les données restent enregistrées
         dans le navigateur de ce téléphone : rien n'est envoyé sur internet. -->

    <header>
      <h1>Intendance du clan</h1>
    </header>

    <!-- 1. Le week-end -->
    <section>
      <h2>Week-end</h2>
      <label>Lequel ? <select id="choix-weekend"></select></label>
      <label>Prix de l'intendance (€) <input id="prix" type="number" min="0" step="0.5"></label>
      <label>Intendant <select id="intendant"></select></label>
    </section>

    <!-- 2. Tout le clan : qui vient ce week-end, et qui a remboursé -->
    <section>
      <h2>Qui vient, qui a remboursé</h2>
      <ul class="liste" id="liste-clan"></ul>
      <p class="total" id="total"></p>
      <form id="ajout-routier" class="ajout">
        <input id="nouveau-prenom" type="text" placeholder="Prénom d'un routier" autocomplete="off">
        <button type="submit" class="petit">Ajouter</button>
      </form>
    </section>

    <!-- 3. Qui apporte quoi -->
    <section>
      <h2>Affaires à apporter</h2>
      <ul class="liste" id="liste-affaires"></ul>
    </section>

    <!-- 4. Le message à coller dans le groupe WhatsApp -->
    <section>
      <h2>Message pour le groupe</h2>
      <p class="aide">Tu peux retoucher le texte avant de le copier.</p>
      <textarea id="message" rows="20"></textarea>
      <button type="button" id="copier">Copier le message</button>
    </section>

    <script src="app.js"></script>
  </body>
</html>
